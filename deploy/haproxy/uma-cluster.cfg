global
    log /dev/log local0
    maxconn 12000
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 5s

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 65s
    timeout server 65s
    timeout tunnel 1h
    timeout http-request 10s

frontend uma_test_ingress
    bind 0.0.0.0:8081
    default_backend uma_slaves

backend uma_slaves
    balance leastconn
    option forwardfor
    http-request set-header X-Forwarded-Client-Port %[src_port]
    option httpchk GET /slave/healthz
    http-check expect status 200
    default-server inter 2s fall 3 rise 2
    server slave-01 172.19.13.214:8011 check weight 100
    server slave-02 172.19.14.102:8011 check weight 100
    server slave-03 172.19.13.71:8011 check weight 100
    server slave-04 172.19.13.243:8011 check weight 100
    server slave-05 172.19.15.105:8011 check weight 100
